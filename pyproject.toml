[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbittransit"
version = "0.1.0"
description = "Reproducible satellite data-delivery scenarios with orbital carrying and traffic diffusion"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Haoyuan Zhao"}]
dependencies = [
    "ephem==4.1.5",
    "sgp4==2.23",
    "astropy==6.1.4",
    "networkx==3.3",
    "geopy==2.4.1",
    "numpy==2.2.4",
    "pandas==2.2.3",
    "matplotlib==3.9.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["NOTICE", "third_party/Hypatia-LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
